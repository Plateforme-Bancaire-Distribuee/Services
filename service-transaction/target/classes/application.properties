spring.application.name=service-transaction

server.port=8083

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://service-config:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-registry:8761/eureka/}

spring.datasource.url=jdbc:postgresql://postgres-transaction:5432/transaction_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=*

account.service.url=http://service-account:8082
