---
# ConfigMap pour Service Account
apiVersion: v1
kind: ConfigMap
metadata:
  name: account-service-config
  namespace: banking-system
data:
  application.properties: |
    spring.application.name=service-account
    server.port=8082
    
    spring.datasource.url=jdbc:postgresql://postgres-services:5432/account_db
    spring.datasource.username=postgres
    spring.datasource.password=postgres
    spring.datasource.driver-class-name=org.postgresql.Driver
    
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    
    spring.kafka.bootstrap-servers=kafka:9092
    spring.kafka.consumer.group-id=account-service-group
    
    eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
    eureka.instance.prefer-ip-address=true
    
    management.endpoints.web.exposure.include=*

---
# Deployment Service Account
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-account
  namespace: banking-system
  labels:
    app: service-account
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-account
  template:
    metadata:
      labels:
        app: service-account
        version: v1
    spec:
      containers:
      - name: service-account
        image: service-account:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        env:
        - name: SPRING_CONFIG_LOCATION
          value: "file:/etc/config/application.properties"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: account-service-config

---
# Service Account Service
apiVersion: v1
kind: Service
metadata:
  name: service-account
  namespace: banking-system
  labels:
    app: service-account
spec:
  type: ClusterIP
  selector:
    app: service-account
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http

---
# HorizontalPodAutoscaler pour Service Account
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service-hpa
  namespace: banking-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-account
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
