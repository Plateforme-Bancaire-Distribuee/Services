---
# ConfigMap pour PostgreSQL Customer
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-customer-config
  namespace: banking-system
data:
  POSTGRES_DB: customer_db
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

---
# Secret pour PostgreSQL Customer
apiVersion: v1
kind: Secret
metadata:
  name: postgres-customer-secret
  namespace: banking-system
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

---
# PersistentVolumeClaim pour PostgreSQL Customer
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-customer-pvc
  namespace: banking-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Deployment PostgreSQL Customer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-customer
  namespace: banking-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-customer
  template:
    metadata:
      labels:
        app: postgres-customer
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - configMapRef:
            name: postgres-customer-config
        - secretRef:
            name: postgres-customer-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-customer-pvc

---
# Service PostgreSQL Customer
apiVersion: v1
kind: Service
metadata:
  name: postgres-customer
  namespace: banking-system
  labels:
    app: postgres-customer
spec:
  type: ClusterIP
  selector:
    app: postgres-customer
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
