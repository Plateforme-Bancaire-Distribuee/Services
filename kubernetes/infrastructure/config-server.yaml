---
# ConfigMap pour Config Server
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: banking-system
data:
  application.yaml: |
    server:
      port: 8888
    
    spring:
      application:
        name: config-server
      cloud:
        config:
          server:
            git:
              uri: https://github.com/Plateforme-Bancaire-Distribuee/config-repo.git
              default-label: main
              clone-on-start: false
    
    eureka:
      client:
        service-url:
          defaultZone: http://service-registry:8761/eureka/
        fetch-registry: true
        register-with-eureka: true
      instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,refresh
      endpoint:
        health:
          show-details: always

---
# Deployment Config Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-config
  namespace: banking-system
  labels:
    app: service-config
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-config
  template:
    metadata:
      labels:
        app: service-config
        version: v1
    spec:
      containers:
      - name: config-server
        image: config-server:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        env:
        - name: SPRING_CONFIG_LOCATION
          value: "file:/etc/config/application.yaml"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m"
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: config-server-config

---
# Service Config Server
apiVersion: v1
kind: Service
metadata:
  name: service-config
  namespace: banking-system
  labels:
    app: service-config
spec:
  type: ClusterIP
  selector:
    app: service-config
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: http

---
# Service Config Server (NodePort for external access)
apiVersion: v1
kind: Service
metadata:
  name: service-config-nodeport
  namespace: banking-system
  labels:
    app: service-config
spec:
  type: NodePort
  selector:
    app: service-config
  ports:
  - port: 8888
    targetPort: 8888
    nodePort: 30888
    protocol: TCP
    name: http
